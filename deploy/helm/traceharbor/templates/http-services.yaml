{{- $root := . -}}
{{- range $name, $service := .Values.httpServices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "traceharbor.fullname" $root }}-{{ $name }}
  labels:
    {{- include "traceharbor.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "traceharbor.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
